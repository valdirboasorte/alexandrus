<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1384e8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Alexandrus: compartilhe sua tela, seu jogo e o som dele ao vivo, sem levar a call junto." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Alexandrus</title>
    <script>
      // Animações: escolha salva no Alexandrus, senão a do sistema (ver src/lib/motion.ts).
      (function () {
        var m = null;
        try { m = localStorage.getItem('alexandrus:motion'); } catch (e) {}
        if (m !== 'full' && m !== 'reduced') m = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
        document.documentElement.dataset.motion = m;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font: 16px/1.5 'Segoe UI', sans-serif; padding: 24px; color: #06306b; background: #bfeaff">
        O Alexandrus precisa de JavaScript para transmitir e assistir em tempo real.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
